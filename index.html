<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div id="root"></div>
  <script>


      class Context {
        constructor(...components){
          this.components = components;
        }
        mount(){
          const root = document.getElementById('root');
          for(const component of this.components)
            root.appendChild(component)
        }
      }

      class Component {
        constructor(html,state){
          this.html = html;
          this.renderComponent(state);
        }

        renderComponent(state){
          this.element = document.createElement('div');
          console.log(state)
          this.element.innerHTML =  state?.data ? this.html.replace('{ state }', state.data) : this.html;
        }
      }


      class State {

        constructor(data){
          this.setState(data);
        }

        setState(data){
          // update virtual dom
          this.data = data;
          this.render();
        }

        render(){
          console.log('update real dom');
        }

      }



      // initialiser le context

      const state = new State('Onarchy');

      const component = new Component('<h1>{ state } Hello</h1>', state);

      const app = new Context(component.element);


      app.mount();


  </script>
</body>
</html>
